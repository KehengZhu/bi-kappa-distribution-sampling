# Finite-precision experiment (experiments/exp4_finite_precision), phase P5 on hosted
# runners: the evidence its portability criterion (gates.G4 in config/protocol.json) is
# decided on.
#
# What the phase tests.  PROTOCOL.md 5.3 makes two portability predictions and tests them
# differently.  On one architecture the stabilized calculation's stream is a function of the
# engine alone, so libc++ and libstdc++ builds must agree BITWISE.  Across architectures
# log, exp and pow are not correctly rounded and the libm implementations differ, so only the
# rates are predicted to agree, within a declared equivalence margin.
#
# Scope.  config/protocol.json limits G4 to one architecture, arm64 macOS with both standard
# libraries, and the committed run met it on the development host (raw/p5/).  The
# macos-arm64 leg below repeats that comparison on a hosted runner, with Homebrew GCC for the
# libstdc++ build.  The Linux legs supply the cross-architecture comparison, which is outside
# the protocol's scope; a disagreement found there would still count against G4.
#
# Cost.  The phase runs at the frozen sizes, unreduced: 10^6 attempts x 5 seeds
# (11001-11005) over the whole kappa list, about a minute of single-core time per build.
# `make p5` first runs `make preflight`, which builds the probe and the 100-digit
# recomputation (Boost headers and MPFR), checks config/protocol.json against
# config/make_protocol.py through uv, and runs `make check-legacy`, which reads commit
# 53dbd30 with git; the checkout therefore fetches the full history.  The per-attempt binary
# files stay on the runner; only counter rows and environment records are uploaded.
#
# What an unavailable environment means.  Not a pass.  The decision job fails when a
# required environment in .github/ci/expected_environments.json is missing, and
# experiments/exp4_finite_precision/results/portability_remote.md gives the commands for
# running an environment by hand.
#
# Files this workflow relies on:
#   * experiments/exp4_finite_precision/GNUmakefile: target `p5`, which honours CXX_LIBCXX and
#     CXX_LIBSTDCXX (an empty CXX_LIBSTDCXX disables that build), echoes its compile lines,
#     and writes raw/p5/p5_<tag>.jsonl for the tags libcxx and libstdcxx.  The collection
#     step renames each to portability_<tag>.jsonl, the name the bundle layout uses.
#   * experiments/exp4_finite_precision/analyze.py --portability-ingest; the contract is
#     stated on that step below.

name: portability (G4)

# Run by hand only: it reruns phase P5 of the finite-precision study on hosted runners.
on:
  workflow_dispatch:

permissions:
  contents: read
  # actions: read is what lets the decision job pull the environments' artifacts back.
  actions: read

concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p5:
    name: P5 ${{ matrix.env_id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # A failure in one environment must still leave the others' evidence on the run.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - env_id: linux-x86_64
            os: ubuntu-latest
            arch: x86_64
            cxx_libcxx: clang++ -stdlib=libc++
            cxx_libstdcxx: g++
            apt: libc++-dev libc++abi-dev libboost-dev libmpfr-dev libgmp-dev
            brew: ""
            experimental: false
          # ubuntu-24.04-arm is a GitHub-hosted arm64 label whose availability depends on
          # the account's plan and on the repository being public.  It is marked
          # experimental and optional: if the label is not served, this leg fails or never
          # starts and the decision job reports arm64 Linux as missing but optional.
          - env_id: linux-arm64
            os: ubuntu-24.04-arm
            arch: arm64
            cxx_libcxx: clang++ -stdlib=libc++
            cxx_libstdcxx: g++
            apt: libc++-dev libc++abi-dev libboost-dev libmpfr-dev libgmp-dev
            brew: ""
            experimental: true
          # The environment the protocol's G4 is scoped to.  Apple clang supplies libc++;
          # the newest Homebrew GCC on the runner supplies libstdc++ (found by the step
          # "select the libstdc++ compiler").
          - env_id: macos-arm64
            os: macos-latest
            arch: arm64
            cxx_libcxx: clang++ -stdlib=libc++
            cxx_libstdcxx: homebrew-gcc
            apt: ""
            brew: boost mpfr gcc
            experimental: false

    steps:
      - name: check out the repository, with history for make check-legacy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install the packages this environment needs (apt)
        if: matrix.apt != ''
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}

      - name: install the packages this environment needs (Homebrew)
        if: matrix.brew != ''
        run: brew install ${{ matrix.brew }}

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: select the libstdc++ compiler
        run: |
          set -euo pipefail
          cxx='${{ matrix.cxx_libstdcxx }}'
          if [ "$cxx" = homebrew-gcc ]; then
            cxx=$(ls "$(brew --prefix)"/bin/g++-[0-9]* 2>/dev/null | sort -V | tail -1 || true)
            cxx=${cxx##*/}
            if [ -z "$cxx" ]; then
              echo "no Homebrew g++ found; the libstdc++ build cannot run" >&2
              exit 1
            fi
          fi
          echo "CXX_LIBSTDCXX_SELECTED=$cxx" >> "$GITHUB_ENV"
          echo "libstdc++ compiler: ${cxx:-none}"

      - name: prepare the evidence directory
        run: mkdir -p "$GITHUB_WORKSPACE/evidence"

      # The build log is evidence, not diagnostics: the environment record quotes the
      # compile line make actually used and fails if the frozen flags are not on it.
      # -ffp-contract=off in particular matters: a fused multiply-add changes the rounding
      # of the very products whose overflow is being counted.
      - name: build the probe and run P5 at the frozen sizes
        run: |
          set -euo pipefail
          make -C experiments/exp4_finite_precision p5 \
            CXX_LIBCXX="${{ matrix.cxx_libcxx }}" \
            CXX_LIBSTDCXX="$CXX_LIBSTDCXX_SELECTED" \
            2>&1 | tee "$GITHUB_WORKSPACE/evidence/run.log"

      - name: record the floating-point environment, once per standard library
        run: |
          set -euo pipefail
          record_one () {
            tag="$1"; shift
            cxx="$*"
            if [ -z "$cxx" ]; then
              echo "no $tag toolchain in this environment; nothing to record"
              return 0
            fi
            # shellcheck disable=SC2086
            $cxx -std=c++11 -O2 -ffp-contract=off -Wall -Wextra \
                 -I cpp -o "$RUNNER_TEMP/env_probe_$tag" .github/ci/env_probe.cpp
            "$RUNNER_TEMP/env_probe_$tag" > "$RUNNER_TEMP/env_probe_$tag.json"
            python3 .github/ci/make_env_record.py \
              --probe-json "$RUNNER_TEMP/env_probe_$tag.json" \
              --tag "$tag" \
              --env-id "${{ matrix.env_id }}" \
              --cxx "$cxx" \
              --repo-root "$GITHUB_WORKSPACE" \
              --build-log "$GITHUB_WORKSPACE/evidence/run.log" \
              --phase P5 \
              --out "$GITHUB_WORKSPACE/evidence/environment_$tag.json"
          }
          record_one libcxx "${{ matrix.cxx_libcxx }}"
          record_one libstdcxx "$CXX_LIBSTDCXX_SELECTED"

      # Counter rows only.  The per-attempt binaries, which the decision does not need, stay
      # on the runner.
      - name: collect the counter rows
        run: |
          set -euo pipefail
          src=experiments/exp4_finite_precision/raw/p5
          found=0
          for f in "$src"/p5_*.jsonl; do
            [ -e "$f" ] || continue
            tag=$(basename "$f" .jsonl); tag=${tag#p5_}
            cp "$f" "$GITHUB_WORKSPACE/evidence/portability_$tag.jsonl"
            found=1
            echo "collected $(basename "$f") as portability_$tag.jsonl ($(wc -l < "$f") rows)"
          done
          if [ "$found" -eq 0 ]; then
            echo "no counter rows were produced in $src" >&2
            exit 1
          fi
          python3 - "$GITHUB_WORKSPACE/evidence" "${{ matrix.env_id }}" \
                    "${{ matrix.arch }}" "${{ matrix.os }}" <<'PY'
          import json, os, sys
          evidence, env_id, arch, os_label = sys.argv[1:5]
          tags = sorted(f[len("environment_"):-len(".json")]
                        for f in os.listdir(evidence)
                        if f.startswith("environment_") and f.endswith(".json"))
          manifest = {
              "schema": "exp7-portability-run/1",
              "experiment": "exp7_confirmatory",
              "phase": "P5",
              "gate": "G4",
              "env_id": env_id,
              "arch": arch,
              "runner_label": os_label,
              "tags": tags,
              "files": sorted(os.listdir(evidence)),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_sha": os.environ.get("GITHUB_SHA"),
          }
          with open(os.path.join(evidence, "run_manifest.json"), "w") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: upload this environment's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portability-${{ matrix.env_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

  g4-decision:
    name: G4 decision
    needs: p5
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: check out the repository
        uses: actions/checkout@v4

      - name: download every environment's evidence
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: evidence
          pattern: portability-*

      # Presence and shape only -- no statistic is computed here.  Its purpose is that a
      # missing environment cannot end as a green check.  The environments are read from
      # .github/ci/expected_environments.json, so that what is expected is stated in one
      # place rather than inferred from whatever turned up.
      - name: coverage of the G4 matrix
        id: coverage
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 .github/ci/check_evidence.py \
            --evidence evidence \
            --expect .github/ci/expected_environments.json \
            --protocol experiments/exp4_finite_precision/config/protocol.json \
            --out evidence/coverage.json

      - name: install uv
        uses: astral-sh/setup-uv@v6

      # The two portability tests, both decided by the experiment's own analysis against
      # config/protocol.json.  Neither rule is reimplemented here.
      #
      # Contract with analyze.py:
      #   analyze.py --portability-ingest <EVIDENCE_DIR>
      # <EVIDENCE_DIR> holds one subdirectory per artifact, named portability-<env_id>,
      # each containing environment_<tag>.json, portability_<tag>.jsonl, run.log and
      # run_manifest.json, plus <EVIDENCE_DIR>/coverage.json written by the step above.
      # It must:
      #   (a) group records by the environment record's "arch" and, within an
      #       architecture, require bitwise equality of every counter of the stabilized
      #       calculation and of the per-row sample digest across standard libraries -- no
      #       tolerance, because the claim is exact (PROTOCOL.md 5.3);
      #   (b) across architectures, run the two one-sided tests on the log rate ratio at
      #       the margin in gates.G4.log_ratio_margin and the level in
      #       statistics.family_alpha.F7_portability, Holm-corrected across
      #       configurations, comparing zero-count cells by the exact conditional test;
      #   (c) ignore every record whose "execution" is not "native";
      #   (d) write results/portability.csv and a machine-readable verdict; and
      #   (e) exit non-zero unless the portability criterion passes.
      - name: F7 tests and the G4 verdict
        id: ingest
        continue-on-error: true
        working-directory: experiments/exp4_finite_precision
        run: |
          set -euo pipefail
          uv run --project ../../python python analyze.py \
            --portability-ingest "$GITHUB_WORKSPACE/evidence"

      - name: upload the decision inputs and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-decision
          path: |
            evidence/
            .github/ci/expected_environments.json
            experiments/exp4_finite_precision/results/
          if-no-files-found: warn
          retention-days: 90

      - name: report the outcome
        run: |
          set -euo pipefail
          coverage='${{ steps.coverage.outcome }}'
          ingest='${{ steps.ingest.outcome }}'
          echo "coverage step: $coverage"
          echo "F7/G4 step:    $ingest"
          if [ "$coverage" != success ] || [ "$ingest" != success ]; then
            echo "G4 is not met by this run: a required environment is missing, or the" >&2
            echo "F7 tests did not pass.  Commands for running an environment by hand are in" >&2
            echo "experiments/exp4_finite_precision/results/portability_remote.md" >&2
            exit 1
          fi
          echo "G4 met on the required environments of .github/ci/expected_environments.json."
